<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUTX — Admin panel</title>
<style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f1f5f9;color:#172033}header{background:#101d36;color:white;padding:18px 6%;display:flex;justify-content:space-between}a{color:#55a6ff}main{max-width:1000px;margin:28px auto;padding:16px}.card{background:white;padding:22px;border-radius:12px;margin-bottom:18px;box-shadow:0 4px 15px #0001}button{padding:10px 15px;background:#1675d1;color:white;border:0;border-radius:7px;cursor:pointer}.muted{color:#64748b}.item{padding:12px 0;border-top:1px solid #ddd}.error{color:#b42318;white-space:pre-wrap}</style></head>
<body><header><b>MUTX | ADMIN</b><a href="cabinet.html">Kabinetga qaytish</a></header><main>
<section class="card"><h2>Admin boshqaruv paneli</h2><p id="status" class="muted">Tekshirilmoqda...</p><button id="reload">Yangilash</button><button id="logout">Chiqish</button></section>
<section class="card"><h3>Foydalanuvchilar</h3><div id="users">Yuklanmoqda...</div></section>
<section class="card"><h3>Shikoyatlar</h3><p class="muted">Faqat complaints.manage ruxsatiga ega adminlar ko‘ra oladi.</p><div id="complaints">Yuklanmoqda...</div></section>
</main><script>
const API="https://mutyx-1.onrender.com",token=localStorage.getItem("mutx_token"),H={"Authorization":"Bearer "+token,"Content-Type":"application/json"},$=id=>document.getElementById(id);
async function req(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...H,...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||"Server xatosi "+r.status);return d}
async function init(){if(!token){location.href="login.html";return}try{const a=await req("/admin/me");$("status").textContent="Rol: "+a.role+" | Ruxsatlar: "+(a.permissions.join(", ")||"—");const users=await req("/admin/users");$("users").innerHTML=users.map(u=>'<div class="item"><b>'+esc(u.full_name)+'</b> · '+esc(u.phone)+'<br><span class="muted">ID: '+u.id+' | '+u.roles.join(", ")+' | '+(u.verified?"Tasdiqlangan":"Tasdiqlanmagan")+'</span></div>').join("")||"Foydalanuvchilar yo‘q";
try{const cs=await req("/admin/complaints");$("complaints").innerHTML=cs.map(c=>'<div class="item"><b>Shikoyat #'+c.id+' · Yuk #'+c.load_id+'</b><br>'+esc(c.reason)+'<br><span class="muted">Holat: '+esc(c.status)+' | Murojaatchi ID: '+c.reporter_id+'</span>'+(c.status==="open"?' <button onclick="decide('+c.id+')">Ko‘rib chiqish</button>':'<br>Qaror: '+esc(c.decision||"—")+' | Jarima: '+c.penalty_amount+' so‘m')+'</div>').join("")||"Shikoyatlar yo‘q";}catch(e){$("complaints").textContent=e.message;}}catch(e){$("status").className="error";$("status").textContent=e.message;$("users").textContent="Ruxsat yoki ma’lumot mavjud emas.";}}
async function decide(id){const decision=prompt("Admin qarorini yozing (kamida 5 belgi):");if(!decision)return;const penalty=Number(prompt("Jarima miqdori (so‘m), jarima bo‘lmasa 0:", "0"));if(!Number.isInteger(penalty)||penalty<0){alert("Jarima miqdori noto‘g‘ri");return}try{await req("/admin/complaints/"+id+"/decision",{method:"POST",body:JSON.stringify({decision,penalty_amount:penalty,status:"resolved"})});alert("Shikoyat ko‘rib chiqildi");init()}catch(e){alert(e.message)}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("reload").onclick=init;$("logout").onclick=()=>{localStorage.removeItem("mutx_token");location.href="login.html"};init();
</script></body></html>
