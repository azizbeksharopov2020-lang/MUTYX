<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUTX — Ro‘yxatdan o‘tish</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
            color: #172033;
        }

        header {
            background: #101d36;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 75px;
        }

        .logo {
            display: inline-block;
            font-size: 32px;
            font-weight: 900;
            color: #55a6ff;
            letter-spacing: 3px;
            visibility: visible;
            opacity: 1;
            text-decoration: none;
        }

        .logo span {
            color: white;
        }

        header a.home-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        header a.home-link:hover {
            color: #55a6ff;
        }

        .container {
            max-width: 460px;
            margin: 40px auto;
            padding: 15px;
        }

        .register-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #142747;
            margin-bottom: 10px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group > label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #d6deea;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        input:focus {
            border-color: #1675d1;
            box-shadow: 0 0 0 3px rgba(22,117,209,0.10);
        }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 58px; }
        .toggle-password {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 42px; padding: 8px 4px; margin: 0; background: transparent;
            color: #1769b0; border: 0; font-size: 20px; line-height: 1;
        }
        .toggle-password:hover { background: #eef6ff; }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            border: 1px solid #d6deea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: normal;
            font-size: 14px;
            transition: 0.2s;
        }

        .role:has(input:checked) {
            border-color: #1675d1;
            background: #eef6ff;
        }

        .role input {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            accent-color: #1675d1;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
            color: #4a5568;
        }

        .terms input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            flex-shrink: 0;
            accent-color: #1675d1;
        }

        .terms label {
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #1675d1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #105eae;
        }
    button:active {
            transform: scale(0.99);
        }

        .notice {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            background: #fff4df;
            color: #805500;
        }

        .notice.error {
            background: #ffe8e8;
            color: #a12525;
        }

        .notice.success {
            background: #e4f8ed;
            color: #176b3a;
        }

        .bottom-text {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #68758a;
        }

        .bottom-text a {
            color: #1675d1;
            font-weight: bold;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #8a94a5;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            header {
                padding: 17px 5%;
            }

            .logo {
                font-size: 28px;
            }

            .register-box {
                padding: 25px 18px;
            }

            .roles {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="../index.html" class="logo">MU<span>TX</span></a>
    <a class="home-link" href="../index.html">Bosh sahifa</a>
</header>

<div class="container">
    <div class="register-box">

        <h1>Ro‘yxatdan o‘tish</h1>

        <p class="subtitle">
            MUTX platformasiga xush kelibsiz!
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullname">Ism va familiya</label>
                <input
                    type="text"
                    id="fullname"
                    placeholder="Masalan: Azizbek Sharopov"
                    minlength="3"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Telefon raqam</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="+998901234567"
                    pattern="\+998[0-9]{9}"
                    title="Telefon raqam +998901234567 ko‘rinishida bo‘lishi kerak"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Parol</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="Kamida 8 ta belgi" minlength="8" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Parolni ko‘rsatish" aria-pressed="false">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Parolni tasdiqlang</label>
                <div class="password-wrap">
                    <input type="password" id="confirmPassword" placeholder="Parolni qayta kiriting" minlength="8" required>
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Parolni ko‘rsatish" aria-pressed="false">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label>Platformadagi rolingiz</label>

                <div class="roles">

                    <label class="role">
                        <input
                            type="checkbox"
                            name="role"
                            value="driver"
                        >
                        <span>🚚 Haydovchi</span>
                    </label>

                    <label class="role">
                        <input
                            type="checkbox"
                            name="role"
                            value="owner"
                        >
                        <span>📦 Yuk egasi</span>
                    </label>

                </div>
            </div>
         <div class="terms">
                <input type="checkbox" id="agreement" required>
                <label for="agreement">
                    MUTX foydalanish shartlari va maxfiylik
                    siyosatiga roziman.
                </label>
            </div>

            <button type="submit">
                Ro‘yxatdan o‘tish
            </button>

            <div class="notice" id="notice"></div>

        </form>

        <div class="bottom-text">
            Akkauntingiz bormi?
            <a href="login.html">Kirish</a>
        </div>

    </div>
</div>

<footer>
    © 2026 MUTX — Yuk va transport platformasi
</footer>

<script>
const API = "https://mutyx-1.onrender.com";
const form = document.getElementById("registerForm");
const notice = document.getElementById("notice");
document.querySelectorAll(".toggle-password").forEach(button => {
  button.addEventListener("click", () => {
    const field = document.getElementById(button.dataset.target);
    const visible = field.type === "password";
    field.type = visible ? "text" : "password";
    button.textContent = visible ? "🙈" : "👁";
    button.setAttribute("aria-label", visible ? "Parolni yashirish" : "Parolni ko‘rsatish");
    button.setAttribute("aria-pressed", String(visible));
  });
});
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  notice.style.display = "block"; notice.className = "notice";
  const password = document.getElementById("password").value;
  if (password.length < 8) { notice.classList.add("error"); notice.textContent = "Parol kamida 8 ta belgidan iborat bo‘lsin."; return; }
  if (password !== document.getElementById("confirmPassword").value) {
    notice.classList.add("error"); notice.textContent = "Parollar bir xil emas."; return;
  }
  const roles = Array.from(document.querySelectorAll('input[name="role"]:checked')).map(x => x.value);
  if (!roles.length) { notice.classList.add("error"); notice.textContent = "Kamida bitta rolni tanlang."; return; }
  const payload = {full_name:document.getElementById("fullname").value.trim(), phone:document.getElementById("phone").value.trim(), password, roles};
  const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Yuborilmoqda...";
  try {
    const response = await fetch(API + "/register", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Ro‘yxatdan o‘tishda xato.");
    localStorage.setItem("mutx_token", data.token);
    notice.classList.add("success"); notice.textContent = "Hisob yaratildi. Kabinet ochilmoqda...";
    setTimeout(() => location.href = "cabinet.html", 700);
  } catch (error) { notice.classList.add("error"); notice.textContent = error.message || "Server bilan aloqa yo‘q."; }
  finally { btn.disabled = false; btn.textContent = "Ro‘yxatdan o‘tish"; }
});
</script>

</body>
</html>
