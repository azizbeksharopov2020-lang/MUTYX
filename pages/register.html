<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUTX — Ro‘yxatdan o‘tish</title>

    <style>:root{--blue:#176fd0;--ink:#17243b;--muted:#718096;--line:#dce5f0;--bg:#f3f7fc}*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}body{background:radial-gradient(circle at 15% 5%,#e5f1ff,transparent 30%),var(--bg);min-height:100vh;color:var(--ink);line-height:1.55}header{background:#101d36;color:white;padding:17px 7%;display:flex;justify-content:space-between;align-items:center;min-height:72px;box-shadow:0 8px 24px #0b1c3520}.logo{font-size:29px;font-weight:900;color:#55a6ff;letter-spacing:2px;text-decoration:none}.logo span{color:white}header a{color:white;text-decoration:none}.container{max-width:480px;margin:42px auto;padding:15px}.login-box,.register-box{background:white;padding:34px;border:1px solid #e5edf6;border-radius:20px;box-shadow:0 18px 50px #102b4d12}h1{text-align:center;color:#142747;margin-bottom:9px;font-size:28px}.subtitle{text-align:center;color:var(--muted);margin-bottom:28px}.form-group{margin-bottom:19px}label{display:block;font-weight:750;margin-bottom:8px;font-size:14px;color:#34445b}input[type=text],input[type=tel],input[type=password]{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;outline:none;font-size:15px;background:#fbfdff}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #176fd018}.password-wrap{position:relative}.password-wrap input{padding-right:58px}.toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:42px;padding:8px 4px;margin:0;background:transparent;color:#1769b0;border:0;font-size:20px;line-height:1}.toggle-password:hover{background:#eef6ff}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}.role:has(input:checked){border-color:var(--blue);background:#eef6ff}.role input,.terms input{width:18px;height:18px;flex-shrink:0;accent-color:var(--blue)}.terms{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;font-size:13px;line-height:1.5;color:#4a5568}.terms input{margin-top:2px}button[type=submit]{width:100%;padding:15px;background:var(--blue);color:white;border:0;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}button[type=submit]:hover{background:#105eae}button:disabled{opacity:.6;cursor:not-allowed}.message,.notice{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#fff4df;color:#805500;font-size:13px;line-height:1.5}.notice.error{background:#ffe8e8;color:#a12525}.notice.success{background:#e4f8ed;color:#176b3a}.bottom-text{text-align:center;margin-top:23px;font-size:14px;color:#68758a}.bottom-text a{color:var(--blue);font-weight:800;text-decoration:none}footer{text-align:center;padding:20px;color:#8a94a5;font-size:13px}@media(max-width:520px){header{padding:15px 5%}.container{margin:22px auto;padding:12px}.login-box,.register-box{padding:25px 19px;border-radius:16px}h1{font-size:24px}.roles{grid-template-columns:1fr}}/* MUTX unified responsive auth design */
header{padding:15px max(5%,calc((100% - 1120px)/2));}
header .logo{font-size:28px;font-weight:950;letter-spacing:1.5px;color:#fff}
header .logo span{color:#59a9ff}
.container{max-width:500px;margin:30px auto 44px;padding:16px}
.login-box,.register-box{padding:clamp(22px,5vw,36px);border-radius:24px;box-shadow:0 18px 55px #102b4d12}
h1{font-size:clamp(25px,5vw,32px)}
input,select,textarea{width:100%;min-height:48px;border:1px solid #dce5f0;border-radius:12px;padding:12px 14px;background:#fbfdff;color:#17243b;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#2678df;box-shadow:0 0 0 3px #2678df20}
button[type=submit]{min-height:50px;border:0;border-radius:13px;background:linear-gradient(120deg,#2678df,#1763b7);font-weight:850;box-shadow:0 8px 18px #2678df30}
.form-group{margin-bottom:17px}
footer{padding:22px 15px;color:#718096;text-align:center}
@media(max-width:520px){header{min-height:64px;padding:13px 5%}.container{margin:16px auto 28px;padding:12px}.login-box,.register-box{border-radius:19px}.subtitle{margin-bottom:22px}}
</style>
</head>

<body>

<header>
    <a href="../index.html" class="logo">MU<span>TX</span></a>
    <a class="home-link" href="../index.html">Bosh sahifa</a>
</header>

<div class="container">
    <div class="register-box">

        <h1>Ro‘yxatdan o‘tish</h1>

        <p class="subtitle">
            MUTX platformasiga xush kelibsiz!
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullname">Ism va familiya</label>
                <input
                    type="text"
                    id="fullname"
                    placeholder="Masalan: Azizbek Sharopov"
                    minlength="3"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Telefon raqam</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="+998901234567"
                    pattern="\+998[0-9]{9}"
                    title="Telefon raqam +998901234567 ko‘rinishida bo‘lishi kerak"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Parol</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="Kamida 8 ta belgi" minlength="8" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Parolni ko‘rsatish" aria-pressed="false">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Parolni tasdiqlang</label>
                <div class="password-wrap">
                    <input type="password" id="confirmPassword" placeholder="Parolni qayta kiriting" minlength="8" required>
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Parolni ko‘rsatish" aria-pressed="false">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label>Platformadagi rolingiz</label>

                <div class="roles">

                    <label class="role">
                        <input
                            type="checkbox"
                            name="role"
                            value="driver"
                        >
                        <span>🚚 Haydovchi</span>
                    </label>

                    <label class="role">
                        <input
                            type="checkbox"
                            name="role"
                            value="owner"
                        >
                        <span>📦 Yuk egasi</span>
                    </label>

                </div>
            </div>
         <div class="terms">
                <input type="checkbox" id="agreement" required>
                <label for="agreement">
                    MUTX foydalanish shartlari va maxfiylik
                    siyosatiga roziman.
                </label>
            </div>

            <button type="submit">
                Ro‘yxatdan o‘tish
            </button>

            <div class="notice" id="notice"></div>

        </form>

        <div class="bottom-text">
            Akkauntingiz bormi?
            <a href="login.html">Kirish</a>
        </div>

    </div>
</div>

<footer>
    © 2026 MUTX — Yuk va transport platformasi
</footer>

<script>
const API = "https://mutyx-1.onrender.com";
const form = document.getElementById("registerForm");
const notice = document.getElementById("notice");
function normalizeUzPhone(value){
  let digits=String(value||"").replace(/\\D/g,"");
  if(digits.length===9) digits="998"+digits;
  return digits.length===12&&digits.startsWith("998")?"+"+digits:null;
}
const phoneInput=document.getElementById("phone");
phoneInput.addEventListener("blur",()=>{const normalized=normalizeUzPhone(phoneInput.value);if(normalized)phoneInput.value=normalized;});

document.querySelectorAll(".toggle-password").forEach(button => {
  button.addEventListener("click", () => {
    const field = document.getElementById(button.dataset.target);
    const visible = field.type === "password";
    field.type = visible ? "text" : "password";
    button.textContent = visible ? "🙈" : "👁";
    button.setAttribute("aria-label", visible ? "Parolni yashirish" : "Parolni ko‘rsatish");
    button.setAttribute("aria-pressed", String(visible));
  });
});
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  notice.style.display = "block"; notice.className = "notice";
  const password = document.getElementById("password").value;
  if (password.length < 8) { notice.classList.add("error"); notice.textContent = "Parol kamida 8 ta belgidan iborat bo‘lsin."; return; }
  if (password !== document.getElementById("confirmPassword").value) {
    notice.classList.add("error"); notice.textContent = "Parollar bir xil emas."; return;
  }
  const roles = Array.from(document.querySelectorAll('input[name="role"]:checked')).map(x => x.value);
  if (!roles.length) { notice.classList.add("error"); notice.textContent = "Kamida bitta rolni tanlang."; return; }
  const normalizedPhone=normalizeUzPhone(phoneInput.value);
  if(!normalizedPhone){notice.classList.add("error");notice.textContent="Telefon raqamni +998901234567 yoki 901234567 ko‘rinishida kiriting.";return;}
  phoneInput.value=normalizedPhone;
  const payload = {full_name:document.getElementById("fullname").value.trim(), phone:normalizedPhone, password, roles};
  const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Yuborilmoqda...";
  try {
    const response = await fetch(API + "/register", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Ro‘yxatdan o‘tishda xato.");
    localStorage.setItem("mutx_token", data.token);
    notice.classList.add("success"); notice.textContent = "Hisob yaratildi. Kabinet ochilmoqda...";
    setTimeout(()=>{location.href=roles.includes("owner")?"owner.html":"driver.html";},700);
  } catch (error) { notice.classList.add("error"); notice.textContent = error.message || "Server bilan aloqa yo‘q."; }
  finally { btn.disabled = false; btn.textContent = "Ro‘yxatdan o‘tish"; }
});
</script>

</body>
</html>
