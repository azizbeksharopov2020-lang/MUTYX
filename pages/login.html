<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUTX — Tizimga kirish</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
            color: #172033;
        }

        header {
            background: #101d36;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #55a6ff;
            letter-spacing: 2px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 460px;
            margin: 55px auto;
            padding: 15px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #142747;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d6deea;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #1675d1;
        }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 58px; }
        .toggle-password {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 42px; padding: 8px 4px; margin: 0; background: transparent;
            color: #1769b0; border: 0; font-size: 20px; line-height: 1;
        }
        .toggle-password:hover { background: #eef6ff; }

        button {
            width: 100%;
            padding: 15px;
            background: #1675d1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #105eae;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #fff4df;
            color: #805500;
            font-size: 13px;
            line-height: 1.5;
        }

        .bottom-text {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #68758a;
        }

        .bottom-text a {
            color: #1675d1;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #8a94a5;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">MUTX</div>
    <a href="../index.html">Bosh sahifa</a>
</header>

<div class="container">
    <div class="login-box">

        <h1>Tizimga kirish</h1>

        <p class="subtitle">
            MUTX akkauntingizga xush kelibsiz!
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="phone">Telefon raqam</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="+998901234567"
                    pattern="\+998[0-9]{9}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Parol</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="Parolingizni kiriting" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Parolni ko‘rsatish" aria-pressed="false">👁</button>
                </div>
            </div>

            <button type="submit">
                Kirish
            </button>
<div class="message" id="message"></div>

        </form>

        <div class="bottom-text">
            Akkauntingiz yo‘qmi?
            <a href="register.html">Ro‘yxatdan o‘tish</a>
        </div>

    </div>
</div>

<footer>
    © 2026 MUTX — Yuk va transport platformasi
</footer>

<script>
const API = "https://mutyx-1.onrender.com";
function normalizeUzPhone(value){
  let digits=String(value||"").replace(/\\D/g,"");
  if(digits.length===9) digits="998"+digits;
  return digits.length===12&&digits.startsWith("998")?"+"+digits:null;
}
const phoneInput=document.getElementById("phone");
phoneInput.addEventListener("blur",()=>{const normalized=normalizeUzPhone(phoneInput.value);if(normalized)phoneInput.value=normalized;});

document.querySelectorAll(".toggle-password").forEach(button => {
  button.addEventListener("click", () => {
    const field = document.getElementById(button.dataset.target);
    const visible = field.type === "password";
    field.type = visible ? "text" : "password";
    button.textContent = visible ? "🙈" : "👁";
    button.setAttribute("aria-label", visible ? "Parolni yashirish" : "Parolni ko‘rsatish");
    button.setAttribute("aria-pressed", String(visible));
  });
});
document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = document.getElementById("message"); message.style.display = "block";
  const btn = event.currentTarget.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Tekshirilmoqda...";
  try {
    const response = await fetch(API + "/login", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:normalizeUzPhone(phoneInput.value)||phoneInput.value.trim(),password:document.getElementById("password").value})});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Kirish amalga oshmadi.");
    localStorage.setItem("mutx_token", data.token);
    message.textContent = "Tizimga muvaffaqiyatli kirdingiz.";
    setTimeout(() => location.href = "cabinet.html", 500);
  } catch (error) { message.textContent = error.message || "Server bilan aloqa yo‘q."; }
  finally { btn.disabled = false; btn.textContent = "Kirish"; }
});
</script>

</body>
</html>
